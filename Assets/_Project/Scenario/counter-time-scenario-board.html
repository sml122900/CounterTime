<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COUNTER TIME 시나리오 보드</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --line:#d8d3c8; --text:#23282e;
    --dim:#6e7681; --accent:#a3781a; --blue:#2f6bad; --danger:#c9402f;
  }
  body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;}

  /* ── 툴바 ── */
  .toolbar{
    position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
    padding:0 14px;z-index:50;
  }
  .toolbar h1{font-size:1rem;font-weight:900;letter-spacing:.08em;color:var(--accent);margin-right:8px;}
  .tb-btn{
    background:#f2efe8;border:1px solid var(--line);border-radius:8px;padding:7px 13px;
    font-family:inherit;font-size:.83rem;font-weight:700;color:var(--text);cursor:pointer;
  }
  .tb-btn:hover{border-color:var(--accent);}
  .tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .save-status{margin-left:auto;font-size:.75rem;color:var(--dim);}
  .hint{font-size:.72rem;color:var(--dim);margin-left:8px;max-width:340px;line-height:1.4;}

  /* ── 보드 ── */
  .board-wrap{position:fixed;inset:52px 0 0 0;overflow:auto;}
  .board{position:relative;width:4000px;height:2600px;
    background-image:radial-gradient(#ddd8cc 1px,transparent 1px);background-size:24px 24px;
    transform-origin:0 0;}
  .board.panning{cursor:grabbing;}
  svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  svg.edges path.hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer;}
  svg.edges path.vis{stroke:#7a7f87;stroke-width:2;fill:none;pointer-events:none;}
  svg.edges g.selected path.vis{stroke:var(--danger);stroke-width:3;}
  svg.edges path.temp{stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5;fill:none;pointer-events:none;}

  /* ── 선택 영역 박스 ── */
  .marquee{position:absolute;border:1.5px dashed var(--accent);background:rgba(163,120,26,.08);z-index:40;pointer-events:none;display:none;}

  /* ── 노드 ── */
  .node{
    position:absolute;background:#fff;border:2px solid #000;border-radius:8px;
    padding:8px 30px 8px 12px;cursor:grab;user-select:none;white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:2;
  }
  .node:active{cursor:grabbing;}
  .node.selected{box-shadow:0 0 0 3px rgba(163,120,26,.45);}
  .node .ttl{font-weight:700;font-size:.9rem;pointer-events:none;}
  .node .port{
    position:absolute;right:-8px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;background:var(--blue);
    border:2px solid #fff;cursor:crosshair;box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .node .port:hover{transform:translateY(-50%) scale(1.25);}

  /* ── 펼쳐진 노드(메모장) ── */
  .node.open{white-space:normal;width:320px;cursor:default;padding:10px 12px;z-index:5;}
  .node.open .ttl{display:none;}
  .n-head{display:flex;gap:6px;margin-bottom:8px;cursor:grab;align-items:center;}
  .n-head input{
    flex:1;font-family:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;min-width:0;
  }
  .n-close{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--dim);padding:2px 6px;}
  .fmt{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center;}
  .fmt button,.fmt select{
    background:#f2efe8;border:1px solid var(--line);border-radius:5px;font-family:inherit;
    font-size:.72rem;padding:3px 7px;cursor:pointer;
  }
  .fmt button:hover{border-color:var(--accent);}
  .fmt .sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0;}
  .n-content{
    border:1px solid var(--line);border-radius:6px;min-height:110px;padding:8px;
    font-size:.84rem;line-height:1.6;background:#fdfcf9;cursor:text;user-select:text;
    white-space:pre-wrap;word-break:break-word;outline:none;
  }
  .n-border-row{display:flex;gap:5px;margin-top:8px;align-items:center;font-size:.72rem;color:var(--dim);}
  .n-border-row .sw{width:18px;height:18px;border-radius:5px;cursor:pointer;border:1px solid var(--line);}

  /* ── 모달 ── */
  .modal-bg{position:fixed;inset:0;background:rgba(40,42,46,.45);display:none;z-index:100;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border-radius:14px;padding:22px;width:440px;max-width:92vw;max-height:82vh;overflow:auto;}
  .modal h2{font-size:1rem;font-weight:800;margin-bottom:14px;color:var(--accent);}
  .modal h3{font-size:.8rem;font-weight:800;margin:16px 0 8px;color:var(--dim);}
  .modal textarea{
    width:100%;height:90px;font-family:inherit;font-size:.85rem;border:1px solid var(--line);
    border-radius:8px;padding:8px;resize:vertical;
  }
  .modal .desc{font-size:.75rem;color:var(--dim);line-height:1.5;margin-bottom:6px;}
  .sc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.83rem;}
  .sc-row .sc-name{flex:1;}
  .sc-key{
    background:#f2efe8;border:1px solid var(--line);border-radius:6px;padding:4px 10px;
    font-size:.78rem;font-weight:700;min-width:90px;text-align:center;
  }
  .sc-key.recording{border-color:var(--danger);color:var(--danger);}
  .sc-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:.72rem;cursor:pointer;font-family:inherit;}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  /* ── 휴지통 ── */
  .trash-item{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:.84rem;
  }
  .trash-item .ti-title{flex:1;font-weight:700;}
  .trash-item .ti-date{font-size:.7rem;color:var(--dim);}
  .trash-item button{font-family:inherit;font-size:.72rem;border-radius:6px;border:1px solid var(--line);background:#f2efe8;padding:4px 9px;cursor:pointer;}
  .trash-item button.del{color:var(--danger);border-color:var(--danger);}
  .empty-msg{font-size:.8rem;color:var(--dim);text-align:center;padding:20px 0;}
</style>
</head>
<body>

<div class="toolbar">
  <h1>COUNTER TIME 보드</h1>
  <button class="tb-btn primary" id="btn-add">+ 노드</button>
  <button class="tb-btn" id="btn-settings">설정</button>
  <button class="tb-btn" id="btn-trash">휴지통 <span id="trash-count"></span></button>
  <button class="tb-btn" id="btn-export">내보내기</button>
  <button class="tb-btn" id="btn-import">가져오기</button>
  <input type="file" id="import-file" accept=".json" style="display:none">
  <span class="hint">더블클릭: 펼치기 · 파란 점 드래그: 화살표 연결 · 빈 곳 드래그: 영역선택 · Space+드래그(또는 휠클릭): 화면 이동 · 간선 클릭: 선택</span>
  <span class="save-status" id="save-status"></span>
</div>

<div class="board-wrap" id="board-wrap">
  <div class="board" id="board">
    <svg class="edges" id="edges">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"></path>
        </marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#c9402f"></path>
        </marker>
      </defs>
    </svg>
    <div class="marquee" id="marquee"></div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="modal-bg" id="settings-modal">
  <div class="modal">
    <h2>설정</h2>
    <h3>새 노드 기본 내용 (템플릿)</h3>
    <div class="desc">새 노드를 만들면 아래 내용이 자동으로 채워집니다.</div>
    <textarea id="tpl-input"></textarea>
    <h3>단축키</h3>
    <div class="desc">[변경]을 누른 뒤 원하는 키(조합)를 누르세요. 텍스트 입력 중에는 단축키가 작동하지 않습니다.</div>
    <div id="sc-list"></div>
    <div class="foot">
      <button class="tb-btn primary" id="settings-save">저장</button>
    </div>
  </div>
</div>

<!-- 휴지통 모달 -->
<div class="modal-bg" id="trash-modal">
  <div class="modal">
    <h2>휴지통 <span style="font-size:.7rem;color:var(--dim);font-weight:400">— 7일이 지난 항목은 자동 삭제됩니다</span></h2>
    <div id="trash-list"></div>
    <div class="foot">
      <button class="tb-btn" id="trash-close">닫기</button>
    </div>
  </div>
</div>

<script>
/* ════════════ 상태 ════════════ */
let G = {
  nodes: [],   // {id,title,content,x,y,border,collapsed}
  edges: [],   // {id,a,b}  (a=시작 → b=끝, 화살표 방향)
  template: '내 행위: \n상대 행위: ',
  shortcuts: {
    add:         {key:'n', ctrl:false, shift:false, alt:false},
    delNode:     {key:'Delete', ctrl:false, shift:false, alt:false},
    delEdge:     {key:'e', ctrl:false, shift:false, alt:false},
    delNodeEdges:{key:'e', ctrl:false, shift:true, alt:false},
    selectAll:   {key:'a', ctrl:true, shift:false, alt:false},
    toggleOpen:  {key:'Tab', ctrl:false, shift:false, alt:false}
  }
};
let TRASH = [];
let selNodes = new Set();   // 다중 선택
let selEdge = null;
let storageMode = null;
let idSeq = 1;
let lastMouse = {x:200, y:200};  // 보드 좌표 기준 최근 마우스 위치
const uid = () => 'n' + (idSeq++) + '_' + Date.now().toString(36);

const $ = id => document.getElementById(id);
const board = $('board'), svg = $('edges'), wrap = $('board-wrap'), marquee = $('marquee');

const SC_LABELS = {
  add:'노드 추가', delNode:'선택 노드 삭제(휴지통)', delEdge:'선택 간선 제거',
  delNodeEdges:'선택 노드의 모든 간선 제거', selectAll:'전체 노드 선택', toggleOpen:'노드 펼치기/최소화'
};
const BORDER_COLORS = ['#000000','#c9402f','#2f6bad','#2e8b57','#d97c06','#7b4bbf'];

/* ════════════ 저장/불러오기 (3단계 폴백) ════════════ */
let saveTimer = null;
async function detectStorage(){
  try{ if(window.storage && window.storage.set){ await window.storage.set('ct-probe','1'); storageMode='app'; return; } }catch(e){}
  try{ localStorage.setItem('ct-probe','1'); localStorage.removeItem('ct-probe'); storageMode='local'; return; }catch(e){}
  storageMode='memory';
}
async function stSet(k,v){ if(storageMode==='app') await window.storage.set(k,v); else if(storageMode==='local') localStorage.setItem(k,v); else throw new Error('no storage'); }
async function stGet(k){
  if(storageMode==='app'){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
  if(storageMode==='local') return localStorage.getItem(k);
  return null;
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await stSet('ct-board', JSON.stringify(G));
      await stSet('ct-trash', JSON.stringify(TRASH));
      const label = storageMode==='app' ? '앱 저장' : '브라우저 저장';
      $('save-status').textContent = label + ' ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){
      $('save-status').textContent = '⚠ 저장 불가 — 파일을 다운로드해 브라우저에서 직접 열면 저장됩니다. 종료 전 [내보내기]로 백업하세요';
    }
  }, 400);
}
async function load(){
  await detectStorage();
  if(storageMode==='memory'){
    $('save-status').textContent = '⚠ 저장 불가 — 파일을 다운로드해 브라우저에서 직접 열면 저장됩니다. 종료 전 [내보내기]로 백업하세요';
  }
  try{
    const g=await stGet('ct-board');
    if(g){
      const saved = JSON.parse(g);
      const defaultShortcuts = G.shortcuts;
      G = Object.assign(G, saved);
      // 저장 데이터에 없는 단축키는 기본값으로 보완 (구버전 데이터 호환)
      G.shortcuts = Object.assign({}, defaultShortcuts, saved.shortcuts || {});
    }
  }catch(e){}
  try{ const t=await stGet('ct-trash'); if(t) TRASH=JSON.parse(t); }catch(e){}
  const WEEK=7*24*60*60*1000, before=TRASH.length;
  TRASH = TRASH.filter(t=>Date.now()-t.deletedAt<WEEK);
  if(TRASH.length!==before) persist();
  idSeq = G.nodes.length + TRASH.length + 1;
  renderAll();
}

/* ════════════ 좌표 변환 ════════════ */
function toBoardCoords(clientX, clientY){
  const r = board.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

/* ════════════ 렌더 ════════════ */
function renderAll(){
  board.querySelectorAll('.node').forEach(n=>n.remove());
  G.nodes.forEach(renderNode);
  renderEdges();
  updateTrashCount();
}
function renderNode(n){
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = n.id;
  el.style.left = n.x+'px'; el.style.top = n.y+'px';
  el.style.borderColor = n.border || '#000';
  el.innerHTML = `<span class="ttl"></span><span class="port" title="드래그해서 화살표 연결"></span>`;
  el.querySelector('.ttl').textContent = n.title || '(제목 없음)';
  if(selNodes.has(n.id)) el.classList.add('selected');
  board.appendChild(el);
  bindNode(el, n);
}
function nodeCenter(n){
  const el = board.querySelector(`.node[data-id="${n.id}"]`);
  if(!el) return {x:n.x, y:n.y};
  return {x: el.offsetLeft + el.offsetWidth/2, y: el.offsetTop + el.offsetHeight/2};
}
// 노드 사각형 경계에서 선이 나가도록 교점 계산 (화살표가 노드 안에 묻히지 않게)
function edgePoint(from, to){
  const el = board.querySelector(`.node[data-id="${from.id}"]`);
  const c = nodeCenter(from);
  if(!el) return c;
  const w = el.offsetWidth/2, h = el.offsetHeight/2;
  const dx = to.x - c.x, dy = to.y - c.y;
  if(dx===0 && dy===0) return c;
  const sx = dx!==0 ? w/Math.abs(dx) : Infinity;
  const sy = dy!==0 ? h/Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: c.x + dx*s, y: c.y + dy*s };
}
function renderEdges(){
  svg.querySelectorAll('g.edge').forEach(e=>e.remove());
  G.edges.forEach(e=>{
    const a = G.nodes.find(n=>n.id===e.a), b = G.nodes.find(n=>n.id===e.b);
    if(!a||!b) return;
    const ca = nodeCenter(a), cb = nodeCenter(b);
    const pa = edgePoint(a, cb), pb = edgePoint(b, ca);  // 양 끝을 노드 경계로
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('edge'); g.dataset.id = e.id;
    const sel = selEdge===e.id;
    if(sel) g.classList.add('selected');
    const mx = (pa.x+pb.x)/2;
    const d = `M${pa.x},${pa.y} C${mx},${pa.y} ${mx},${pb.y} ${pb.x},${pb.y}`;
    const vis = `<path class="vis" d="${d}" marker-end="url(#${sel?'arrow-sel':'arrow'})"></path>`;
    g.innerHTML = `<path class="hit" d="${d}"></path>${vis}`;
    g.querySelector('.hit').addEventListener('click', ev=>{ ev.stopPropagation(); selectEdge(e.id); });
    svg.appendChild(g);
  });
}

/* ════════════ 선택 ════════════ */
function clearSel(){ selNodes.clear(); selEdge=null; syncSelClass(); }
function syncSelClass(){
  board.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected', selNodes.has(el.dataset.id)));
  renderEdges();
}
function selectNode(id, additive){
  selEdge=null;
  if(!additive) selNodes.clear();
  if(additive && selNodes.has(id)) selNodes.delete(id); else selNodes.add(id);
  syncSelClass();
}
function selectEdge(id){ selNodes.clear(); selEdge=id; syncSelClass(); }
function selectAll(){ selEdge=null; selNodes = new Set(G.nodes.map(n=>n.id)); syncSelClass(); }

/* ════════════ 노드 상호작용 ════════════ */
function bindNode(el, n){
  el.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('port')) return;
    if(el.classList.contains('open') && !e.target.closest('.n-head')) return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.isContentEditable) return;
    if(spaceDown) return; // 팬 모드 우선
    e.preventDefault();
    // 선택 처리: 이미 선택된 뭉텅이면 유지, 아니면 새로 선택
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    if(!selNodes.has(n.id)) selectNode(n.id, additive);
    else if(additive){ selectNode(n.id, true); return; }
    // 선택된 모든 노드를 함께 드래그
    const startX = e.clientX, startY = e.clientY;
    const moving = [...selNodes].map(id=>{ const nn=G.nodes.find(x=>x.id===id); return {nn, ox:nn.x, oy:nn.y}; });
    let dragged=false;
    function mv(ev){
      dragged=true;
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      moving.forEach(({nn,ox,oy})=>{
        nn.x = Math.max(0, ox+dx); nn.y = Math.max(0, oy+dy);
        const ne = board.querySelector(`.node[data-id="${nn.id}"]`);
        if(ne){ ne.style.left=nn.x+'px'; ne.style.top=nn.y+'px'; }
      });
      renderEdges();
    }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); if(dragged) persist(); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });

  el.addEventListener('dblclick', e=>{
    if(e.target.classList.contains('port')) return;
    if(el.classList.contains('open')) return;
    openNode(el, n);
  });

  el.querySelector('.port').addEventListener('mousedown', e=>{
    e.preventDefault(); e.stopPropagation();
    const from = n;
    const temp = document.createElementNS('http://www.w3.org/2000/svg','path');
    temp.setAttribute('class','temp'); temp.setAttribute('marker-end','url(#arrow)'); svg.appendChild(temp);
    function mv(ev){
      const p = toBoardCoords(ev.clientX, ev.clientY);
      const c = nodeCenter(from);
      const start = edgePoint(from, p);
      temp.setAttribute('d', `M${start.x},${start.y} L${p.x},${p.y}`);
    }
    function up(ev){
      document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      temp.remove();
      const target = ev.target.closest && ev.target.closest('.node');
      if(target && target.dataset.id !== from.id){
        const bId = target.dataset.id;
        // 같은 방향 중복만 방지 (역방향은 허용 — 회귀 시나리오용)
        const dup = G.edges.some(ed=>ed.a===from.id && ed.b===bId);
        if(!dup){ G.edges.push({id:uid(), a:from.id, b:bId}); renderEdges(); persist(); }
      }
    }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
}

/* ════════════ 노드 펼치기 (메모장) ════════════ */
function openNode(el, n){
  el.classList.add('open');
  n.collapsed = false;
  const editor = document.createElement('div');
  editor.className = 'n-editor';
  editor.innerHTML = `
    <div class="n-head">
      <input type="text" value="" placeholder="제목">
      <button class="n-close" title="최소화 (Tab)">▲</button>
    </div>
    <div class="fmt">
      <button data-cmd="bold"><b>B</b></button>
      <select data-size>
        <option value="">글씨 크기</option>
        <option value="2">작게</option>
        <option value="3">보통</option>
        <option value="5">크게</option>
      </select>
      <button class="sw" data-color="#c9402f" style="background:#c9402f" title="빨강 글씨"></button>
      <button class="sw" data-color="#2f6bad" style="background:#2f6bad" title="파랑 글씨"></button>
      <button class="sw" data-color="#2e8b57" style="background:#2e8b57" title="초록 글씨"></button>
      <button class="sw" data-color="#23282e" style="background:#23282e" title="검정 글씨"></button>
      <button class="sw" data-hl="#fff3a3" style="background:#fff3a3" title="노랑 형광펜"></button>
      <button class="sw" data-hl="#c8f0d4" style="background:#c8f0d4" title="초록 형광펜"></button>
      <button class="sw" data-hl="transparent" style="background:#fff" title="형광펜 지우기">✕</button>
    </div>
    <div class="n-content" contenteditable="true"></div>
    <div class="n-border-row">테두리:
      ${BORDER_COLORS.map(c=>`<span class="sw" data-border="${c}" style="background:${c}"></span>`).join('')}
    </div>`;
  el.appendChild(editor);
  const titleInput = editor.querySelector('input');
  const content = editor.querySelector('.n-content');
  titleInput.value = n.title;
  content.innerHTML = n.content || '';

  editor.querySelector('[data-cmd="bold"]').addEventListener('click', e=>{e.preventDefault(); content.focus(); document.execCommand('bold');});
  editor.querySelector('[data-size]').addEventListener('change', e=>{ if(e.target.value){ content.focus(); document.execCommand('fontSize',false,e.target.value); e.target.value=''; }});
  editor.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click', e=>{ e.preventDefault(); content.focus(); document.execCommand('foreColor',false,b.dataset.color); }));
  editor.querySelectorAll('[data-hl]').forEach(b=>b.addEventListener('click', e=>{ e.preventDefault(); content.focus(); document.execCommand('hiliteColor',false,b.dataset.hl); }));
  editor.querySelectorAll('[data-border]').forEach(b=>b.addEventListener('click', ()=>{ n.border=b.dataset.border; el.style.borderColor=n.border; persist(); }));

  const save = ()=>{ n.title=titleInput.value; n.content=content.innerHTML; persist(); };
  titleInput.addEventListener('input', save);
  content.addEventListener('input', save);
  editor.querySelector('.n-close').addEventListener('click', ()=>closeNode(el, n));
  renderEdges();
  titleInput.focus();
}
function closeNode(el, n){
  const editor = el.querySelector('.n-editor');
  if(editor){ n.title = editor.querySelector('input').value; n.content = editor.querySelector('.n-content').innerHTML; }
  el.classList.remove('open');
  if(editor) editor.remove();
  el.querySelector('.ttl').textContent = n.title || '(제목 없음)';
  n.collapsed = true;
  renderEdges(); persist();
}
function toggleOpenSelected(){
  // 선택된 노드가 있으면 그것들, 없으면 열려있는 노드 처리
  const targets = selNodes.size ? [...selNodes] : [];
  if(!targets.length) return;
  targets.forEach(id=>{
    const el = board.querySelector(`.node[data-id="${id}"]`);
    const n = G.nodes.find(x=>x.id===id);
    if(!el||!n) return;
    if(el.classList.contains('open')) closeNode(el, n);
    else openNode(el, n);
  });
}

/* ════════════ 노드/간선 조작 ════════════ */
function addNode(atBoardXY){
  const pos = atBoardXY || lastMouse;
  const n = {
    id: uid(), title:'새 노드',
    content: (G.template||'').replace(/\n/g,'<br>'),
    x: Math.max(0, pos.x - 40), y: Math.max(0, pos.y - 16),
    border:'#000000', collapsed:true
  };
  G.nodes.push(n);
  renderNode(n);
  selectNode(n.id, false);
  persist();
}
function deleteSelectedNodes(){
  if(!selNodes.size) return;
  [...selNodes].forEach(id=>{
    const n = G.nodes.find(x=>x.id===id);
    if(!n) return;
    const connected = G.edges.filter(e=>e.a===id||e.b===id);
    TRASH.push({node:n, edges:connected, deletedAt:Date.now()});
  });
  const ids = new Set(selNodes);
  G.nodes = G.nodes.filter(x=>!ids.has(x.id));
  G.edges = G.edges.filter(e=>!ids.has(e.a)&&!ids.has(e.b));
  selNodes.clear();
  renderAll(); persist();
}
function deleteSelectedEdge(){
  if(!selEdge) return;
  G.edges = G.edges.filter(e=>e.id!==selEdge);
  selEdge=null; renderEdges(); persist();
}
function deleteNodeEdges(){
  if(!selNodes.size) return;
  const ids = new Set(selNodes);
  G.edges = G.edges.filter(e=>!ids.has(e.a)&&!ids.has(e.b));
  renderEdges(); persist();
}

/* ════════════ 화면 팬(이동) + 영역선택 ════════════ */
let spaceDown=false;
document.addEventListener('keydown', e=>{ if(e.code==='Space' && !isTyping(e.target)){ spaceDown=true; board.classList.add('panning'); }});
document.addEventListener('keyup', e=>{ if(e.code==='Space'){ spaceDown=false; board.classList.remove('panning'); }});

wrap.addEventListener('mousedown', e=>{
  const onNode = e.target.closest('.node');
  const onEdge = e.target.closest('.edge');
  // 팬: Space+드래그 또는 휠(가운데) 버튼
  if((spaceDown || e.button===1)){
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY, sl=wrap.scrollLeft, st=wrap.scrollTop;
    function mv(ev){ wrap.scrollLeft = sl-(ev.clientX-sx); wrap.scrollTop = st-(ev.clientY-sy); }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    return;
  }
  // 빈 곳 좌클릭 → 영역 선택 시작
  if(e.button===0 && !onNode && !onEdge){
    clearSel();
    const start = toBoardCoords(e.clientX, e.clientY);
    marquee.style.display='block';
    marquee.style.left=start.x+'px'; marquee.style.top=start.y+'px';
    marquee.style.width='0px'; marquee.style.height='0px';
    function mv(ev){
      const p = toBoardCoords(ev.clientX, ev.clientY);
      const x=Math.min(p.x,start.x), y=Math.min(p.y,start.y), w=Math.abs(p.x-start.x), h=Math.abs(p.y-start.y);
      marquee.style.left=x+'px'; marquee.style.top=y+'px'; marquee.style.width=w+'px'; marquee.style.height=h+'px';
    }
    function up(ev){
      document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      const p = toBoardCoords(ev.clientX, ev.clientY);
      const x1=Math.min(p.x,start.x), y1=Math.min(p.y,start.y), x2=Math.max(p.x,start.x), y2=Math.max(p.y,start.y);
      marquee.style.display='none';
      if(Math.abs(x2-x1)>4 || Math.abs(y2-y1)>4){
        selNodes.clear();
        G.nodes.forEach(n=>{
          const el = board.querySelector(`.node[data-id="${n.id}"]`);
          if(!el) return;
          const nx=el.offsetLeft, ny=el.offsetTop, nw=el.offsetWidth, nh=el.offsetHeight;
          if(nx<x2 && nx+nw>x1 && ny<y2 && ny+nh>y1) selNodes.add(n.id);
        });
        syncSelClass();
      }
    }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  }
});

// 마우스 위치 추적 (노드 추가 위치용)
wrap.addEventListener('mousemove', e=>{ lastMouse = toBoardCoords(e.clientX, e.clientY); });

/* ════════════ 휴지통 ════════════ */
function updateTrashCount(){ $('trash-count').textContent = TRASH.length ? `(${TRASH.length})` : ''; }
function renderTrash(){
  const box = $('trash-list');
  if(!TRASH.length){ box.innerHTML='<div class="empty-msg">휴지통이 비어 있습니다.</div>'; return; }
  box.innerHTML='';
  TRASH.slice().reverse().forEach(t=>{
    const daysLeft = Math.max(0, 7-Math.floor((Date.now()-t.deletedAt)/86400000));
    const d = document.createElement('div');
    d.className='trash-item';
    d.innerHTML = `<span class="ti-title"></span>
      <span class="ti-date">${new Date(t.deletedAt).toLocaleDateString('ko-KR')} 삭제 · ${daysLeft}일 후 영구삭제</span>
      <button class="restore">복원</button><button class="del">영구삭제</button>`;
    d.querySelector('.ti-title').textContent = t.node.title || '(제목 없음)';
    d.querySelector('.restore').addEventListener('click', ()=>{
      G.nodes.push(t.node);
      t.edges.forEach(e=>{ const ok=G.nodes.some(n=>n.id===e.a)&&G.nodes.some(n=>n.id===e.b); if(ok&&!G.edges.some(x=>x.id===e.id)) G.edges.push(e); });
      TRASH = TRASH.filter(x=>x!==t);
      renderAll(); renderTrash(); persist();
    });
    d.querySelector('.del').addEventListener('click', ()=>{ TRASH=TRASH.filter(x=>x!==t); renderTrash(); updateTrashCount(); persist(); });
    box.appendChild(d);
  });
}

/* ════════════ 설정 ════════════ */
function fmtShortcut(s){
  if(!s || !s.key) return '(미설정)';
  const p=[]; if(s.ctrl)p.push('Ctrl'); if(s.shift)p.push('Shift'); if(s.alt)p.push('Alt');
  p.push(s.key.length===1?s.key.toUpperCase():s.key); return p.join(' + ');
}
function renderShortcutList(){
  const box=$('sc-list'); box.innerHTML='';
  if(!G.shortcuts) G.shortcuts={};
  Object.entries(SC_LABELS).forEach(([act,label])=>{
    const row=document.createElement('div'); row.className='sc-row';
    row.innerHTML = `<span class="sc-name">${label}</span>
      <span class="sc-key" data-act="${act}">${fmtShortcut(G.shortcuts[act])}</span>
      <button class="sc-btn">변경</button>`;
    row.querySelector('.sc-btn').addEventListener('click', ()=>{
      const keyEl=row.querySelector('.sc-key'); keyEl.classList.add('recording'); keyEl.textContent='키 입력...';
      function rec(e){
        e.preventDefault(); e.stopPropagation();
        if(['Control','Shift','Alt','Meta'].includes(e.key)) return;
        G.shortcuts[act]={key:e.key, ctrl:e.ctrlKey, shift:e.shiftKey, alt:e.altKey};
        keyEl.classList.remove('recording'); keyEl.textContent=fmtShortcut(G.shortcuts[act]);
        document.removeEventListener('keydown',rec,true); persist();
      }
      document.addEventListener('keydown',rec,true);
    });
    box.appendChild(row);
  });
}

/* ════════════ 전역 단축키 ════════════ */
function isTyping(t){ return t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable; }
document.addEventListener('keydown', e=>{
  if(isTyping(e.target)) return;
  if($('settings-modal').classList.contains('show')||$('trash-modal').classList.contains('show')) return;
  const match = s => e.key.toLowerCase()===s.key.toLowerCase() && e.ctrlKey===s.ctrl && e.shiftKey===s.shift && e.altKey===s.alt;
  if(match(G.shortcuts.selectAll)){ e.preventDefault(); selectAll(); }
  else if(match(G.shortcuts.toggleOpen)){ e.preventDefault(); toggleOpenSelected(); }
  else if(match(G.shortcuts.add)){ e.preventDefault(); addNode(); }
  else if(match(G.shortcuts.delNode)){ e.preventDefault(); deleteSelectedNodes(); }
  else if(match(G.shortcuts.delNodeEdges)){ e.preventDefault(); deleteNodeEdges(); }
  else if(match(G.shortcuts.delEdge)){ e.preventDefault(); deleteSelectedEdge(); }
});

/* ════════════ 툴바/모달 바인딩 ════════════ */
$('btn-add').addEventListener('click', ()=>addNode());
$('btn-settings').addEventListener('click', ()=>{
  try{ $('tpl-input').value=G.template||''; renderShortcutList(); }
  catch(err){ console.error('설정 목록 렌더 오류:', err); }
  $('settings-modal').classList.add('show');  // 오류가 나도 모달은 연다
});
$('settings-save').addEventListener('click', ()=>{ G.template=$('tpl-input').value; $('settings-modal').classList.remove('show'); persist(); });
$('btn-trash').addEventListener('click', ()=>{ renderTrash(); $('trash-modal').classList.add('show'); });
$('trash-close').addEventListener('click', ()=>$('trash-modal').classList.remove('show'));
[$('settings-modal'),$('trash-modal')].forEach(m=>m.addEventListener('mousedown', e=>{ if(e.target===m) m.classList.remove('show'); }));

/* ── 내보내기 ── */
$('btn-export').addEventListener('click', ()=>{
  const data = {
    exported:new Date().toISOString(), app:'counter-time-scenario-board',
    nodes: G.nodes.map(n=>({ id:n.id, title:n.title,
      content:n.content.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,''),
      contentHtml:n.content, x:n.x, y:n.y, border:n.border })),
    edges: G.edges.map(e=>({from:e.a, to:e.b}))
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'counter-time-scenario-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
});
/* ── 가져오기 ── */
$('btn-import').addEventListener('click', ()=>$('import-file').click());
$('import-file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data.nodes)) throw new Error('형식 오류');
      G.nodes = data.nodes.map(n=>({ id:n.id, title:n.title||'', content:n.contentHtml||n.content||'', x:n.x||100, y:n.y||100, border:n.border||'#000000', collapsed:true }));
      G.edges = (data.edges||[]).map((ed,i)=>({id:'e'+i+'_'+Date.now().toString(36), a:ed.from, b:ed.to}));
      clearSel(); renderAll(); persist();
    }catch(err){ alert('가져오기 실패: 올바른 보드 JSON 파일이 아닙니다.'); }
  };
  r.readAsText(f); e.target.value='';
});

/* ════════════ 시작 ════════════ */
load();
</script>
